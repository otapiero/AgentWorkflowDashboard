# Mission Control configuration.
#
# Copied to %USERPROFILE%\.mc\config.yaml by scripts/install.ps1.
# Everything workflow-shaped lives here so it can change without code edits.

repo:
  # Absolute path to the local clone. Note the folder name differs from the
  # GitHub repo name on this machine.
  path: 'C:\src\widgets'
  owner: 'acme'
  name: 'widgets'
  baseBranch: 'dev'
  # Branch prefix is a personal convention and is NOT the GitHub login
  # (gh is authenticated as otapiero).
  branchPrefix: 'ouriel'

github:
  auth: gh-cli
  pollIntervalSeconds: 30
  # Verified against real review threads on this repo.
  copilotReviewerLogin: 'copilot-pull-request-reviewer'

# How a spawn opens its terminal: 'wt' (Windows Terminal, default) or 'vscode'
# (opens the worktree in VS Code and runs the agent in the integrated terminal).
# Also switchable live from the Agents settings panel.
launcher: wt

agents:
  # Verified against claude 2.1.x: prompt is positional, standing rules go
  # through --append-system-prompt, and --effort sets reasoning effort.
  # models/efforts populate the pickers; edit them if the CLI's options change.
  claude:
    launch: 'claude'
    promptMode: positional
    modelFlag: '--model'
    effortFlag: '--effort'
    instructionMode: flag
    instructionFlag: '--append-system-prompt'
    model: default
    models: [default, opus, sonnet, haiku]
    efforts: [low, medium, high, xhigh, max]

  # Verified against copilot 1.0.73: -i starts an interactive session with the
  # prompt preloaded, there is no system-prompt flag (standing rules are
  # prepended into the prompt body), and --effort sets reasoning effort.
  copilot:
    launch: 'copilot'
    promptMode: flag
    promptFlag: '-i'
    modelFlag: '--model'
    effortFlag: '--effort'
    instructionMode: inline
    model: default
    # Edit this list to match the models your copilot CLI actually offers
    # (run /model in an interactive `copilot` session to see them).
    models: [auto, claude-sonnet-5, gpt-5.6-luna, gpt-5.6-sol, gpt-5.6-terra]
    efforts: [none, minimal, low, medium, high, xhigh, max]

pipeline:
  - id: plan
    label: Plan
    actor: claude
    command: mc-planner
    spawnable: true
    gate: { type: manual }

  - id: implement
    label: Implement
    actor: claude
    command: mc-implementer
    spawnable: true
    repeatable: true
    gate: { type: manual }

  - id: publish
    label: Publish
    actor: claude
    command: mc-publish
    spawnable: true
    gate: { type: auto, signal: pr_exists }

  - id: ci
    label: CI
    actor: none
    gate: { type: auto, signal: checks_green }
    onFail: { offerSpawnPhase: ci_fix }

  - id: copilot_review
    label: Copilot review
    actor: claude
    command: mc-fix-review
    spawnable: true
    repeatable: true
    gate: { type: auto, signal: copilot_comments_resolved }

  - id: dev_review
    label: Dev review
    actor: claude
    command: mc-fix-review
    spawnable: true
    repeatable: true
    gate: { type: auto, signal: approved_and_threads_resolved }

  - id: merge
    label: Merge
    actor: you
    gate: { type: manual }

server:
  port: 4317
