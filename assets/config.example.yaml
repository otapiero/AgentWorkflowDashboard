# Mission Control configuration.
#
# Written by `npm run mc -- init`, which fills the repo block in from `git` and
# `gh`. Everything workflow-shaped lives here so it can change without code
# edits. Edit it by hand whenever you like; it is never overwritten.

repo:
  # Absolute path to the local clone. It does not have to be named after the
  # GitHub repository.
  path: '{{repoPath}}'
  owner: '{{owner}}'
  name: '{{repoName}}'
  baseBranch: '{{baseBranch}}'
  # Prefix for the branches Mission Control creates: <prefix>/<issue>-<slug>.
  # `mc init` seeds this from your GitHub login; change it to whatever
  # convention your team uses.
  branchPrefix: '{{branchPrefix}}'

github:
  auth: gh-cli
  pollIntervalSeconds: 30
  # The login that posts automated review comments. Used by the copilot_review
  # gate to tell bot threads from human ones.
  copilotReviewerLogin: 'copilot-pull-request-reviewer'

# How a spawn opens its terminal:
#   'wt'     Windows Terminal (default) — one titled tab per task.
#   'vscode' opens the worktree in VS Code, agent in the integrated terminal.
#   't3'     runs the phase as a T3 Code thread bound to the same worktree.
# Also switchable live from the Agents settings panel.
launcher: wt

# What to retire when you mark a task done.
#
# Pinning a task to 'done' is you saying the work is finished, and that is what
# retires its checkout -- not a merged PR, which is GitHub's opinion about the
# code rather than yours about the work. Before the checkout goes, anything
# git still reports as uncommitted -- scratch notes, exported fixtures,
# research an agent wrote beside the code -- is copied into the task's own
# directory, so an automatic cleanup can never destroy work that was never
# committed. Gitignored files are not touched, so build output and
# node_modules are left where they belong.
#
# deleteBranch force-deletes: these repositories squash-merge, so the branch's
# own commits never land in the base branch and `git branch -d` would refuse
# every merged branch it is handed.
cleanup:
  onDone: true
  deleteBranch: true

# T3 Code integration, used only by the 't3' launcher.
#
# Requires a pairing credential at %USERPROFILE%\.mission-control\t3-credential.
# Mint one in T3: Settings -> This environment -> Authorized clients ->
# Create link, then save the "This machine" URL there. Do it promptly: the
# link is single-use and expires within about three minutes. Mission Control
# cannot mint it for you — T3 only bootstraps its own renderer.
#
# The access token that link buys lasts 30 days and is cached in
# %USERPROFILE%\.mission-control\t3-token.json, so this is a one-time step.
t3:
  projectTitle: '{{repoName}}'
  # The T3 version this integration was verified against. `mc doctor` warns
  # when the running server differs; it never blocks.
  pinnedVersion: '0.0.31'

agents:
  # Verified against claude 2.1.x: prompt is positional, standing rules go
  # through --append-system-prompt, and --effort sets reasoning effort.
  # models/efforts populate the pickers; edit them if the CLI's options change.
  claude:
    launch: 'claude'
    promptMode: positional
    modelFlag: '--model'
    effortFlag: '--effort'
    instructionMode: flag
    instructionFlag: '--append-system-prompt'
    model: default
    models: [default, opus, sonnet, haiku]
    efforts: [low, medium, high, xhigh, max]
    # T3 provider instance that runs this agent on the 't3' launcher. It
    # advertises released slugs rather than the CLI's aliases, so the launcher
    # reads each alias above as that family's newest release
    # (opus -> claude-opus-5).
    t3Instance: 'claudeAgent'

  # Verified against copilot 1.0.73: -i starts an interactive session with the
  # prompt preloaded, there is no system-prompt flag (standing rules are
  # prepended into the prompt body), and --effort sets reasoning effort.
  copilot:
    launch: 'copilot'
    promptMode: flag
    promptFlag: '-i'
    modelFlag: '--model'
    effortFlag: '--effort'
    instructionMode: inline
    model: default
    # Edit this list to match the models your copilot CLI actually offers
    # (run /model in an interactive `copilot` session to see them).
    models: [auto, claude-sonnet-5, gpt-5.6-luna, gpt-5.6-sol, gpt-5.6-terra]
    efforts: [none, minimal, low, medium, high, xhigh, max]
    # T3 has no GitHub Copilot CLI driver. The 't3' launcher therefore routes
    # copilot through OpenCode, which GitHub supports against a Copilot
    # subscription (Pro, Pro+, Business or Enterprise — Free will not work).
    # This is a substitution, not a passthrough: it is OpenCode's agent loop
    # using Copilot's models, not the Copilot CLI harness the 'wt' launcher
    # drives. Requires the `opencode` CLI installed and authenticated.
    # OpenCode names models 'provider/model', so the 't3' launcher qualifies
    # the bare names above against the slugs the instance advertises
    # (claude-sonnet-5 -> github-copilot/claude-sonnet-5). 'auto' is a Copilot
    # CLI concept with no OpenCode equivalent, so it works only on 'wt'.
    t3Instance: 'opencode'

  # Codex CLI launches its interactive TUI from a positional prompt. Global
  # options precede that prompt, and reasoning effort is a config override.
  # The task directory is added to the workspace-write sandbox so the agent can
  # write Mission Control's plan and marker artifacts outside the git worktree.
  codex:
    launch: 'codex'
    promptMode: positional
    promptPosition: last
    modelFlag: '--model'
    effortFlag: '-c'
    effortValueTemplate: 'model_reasoning_effort="{{effort}}"'
    instructionMode: inline
    model: default
    models: [default, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]
    efforts: [low, medium, high, xhigh, max, ultra]
    extraArgs: ['--sandbox', 'workspace-write', '--ask-for-approval', 'on-request', '--add-dir', '{{taskDir}}']
    t3Instance: 'codex'

pipeline:
  - id: plan
    label: Plan
    actor: claude
    command: mc-planner
    spawnable: true
    gate: { type: manual }
    # T3-only: how much the agent may do without asking, and whether it
    # starts in T3's native plan mode. Ignored by the wt and vscode launchers.
    t3:
      runtimeMode: full-access
      interactionMode: plan

  - id: implement
    label: Implement
    actor: claude
    command: mc-implementer
    spawnable: true
    repeatable: true
    gate: { type: manual }
    t3:
      runtimeMode: full-access
      interactionMode: default

  - id: publish
    label: Publish
    actor: claude
    command: mc-publish
    spawnable: true
    gate: { type: auto, signal: pr_exists }
    t3:
      runtimeMode: full-access
      interactionMode: default

  - id: ci
    label: CI
    actor: none
    gate: { type: auto, signal: checks_green }
    onFail: { offerSpawnPhase: ci_fix }

  - id: copilot_review
    label: Copilot review
    actor: claude
    command: mc-fix-review
    spawnable: true
    repeatable: true
    gate: { type: auto, signal: copilot_comments_resolved }
    t3:
      runtimeMode: full-access
      interactionMode: default

  - id: dev_review
    label: Dev review
    actor: claude
    command: mc-fix-review
    spawnable: true
    repeatable: true
    gate: { type: auto, signal: approved_and_threads_resolved }
    t3:
      runtimeMode: full-access
      interactionMode: default

  - id: merge
    label: Merge
    actor: you
    gate: { type: manual }

server:
  port: 4317
