name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Mission Control is a Windows application: the phase scripts are
    # PowerShell and the default launcher is Windows Terminal. Testing on
    # anything else would verify a configuration nobody runs.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  e2e:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  extension:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      # The extension imports the app's shared types, and those reach into
      # server modules typed against the app's own dependencies (fastify).
      - run: npm ci

      - run: npm run extension:install-deps

      - run: npm --prefix vscode-extension run typecheck

      - run: npm --prefix vscode-extension run test:unit

      - run: npm --prefix vscode-extension run build

      # The VS Code integration test is left out: it downloads a full
      # editor. Run `npm run extension:test-host` by hand.
